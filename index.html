# 项目概述

## 简介

**KnowBase** 是一个基于 RAG（检索增强生成）的自托管私人知识数据库系统。核心理念是 **"你的知识，随时可问"**。

用户可以将本地的 Word、PDF、PPT、Markdown 等格式文件导入系统，系统自动完成文档解析、向量化存储和索引构建。当用户通过手机飞书向机器人提问时，系统基于知识库进行 RAG 检索增强生成，返回精准答案并标注来源引用。

## 核心能力

- ✅ 支持 **9 种文档格式** 导入（PDF、DOCX、PPTX、Markdown、TXT、XLSX、CSV、HTML、DOC）
- ✅ **飞书机器人 WebSocket 长连接**，无需公网 IP，本地即可运行
- ✅ **多模型 LLM 灵活切换**（DeepSeek、OpenAI、通义千问、智谱 GLM、Ollama 本地模型）
- ✅ **中文优化的 Embedding 模型**（BGE-small-zh），检索精度高
- ✅ **RAG 流式回答**，实时生成，附带来源文件引用
- ✅ **工作区隔离**，支持按主题分类管理知识
- ✅ **Web 管理界面**，文件上传、文档管理、检索测试一站式操作
- ✅ **Docker Compose 一键部署**

## 技术栈总览

### 后端（Python 3.11+）

| 组件 | 技术 | 说明 |
|------|------|------|
| Web 框架 | FastAPI | 异步原生，自动 OpenAPI 文档 |
| 任务队列 | Celery + Redis | 文档解析/向量化异步处理 |
| 文档解析 | PyMuPDF / python-docx / python-pptx / BeautifulSoup | 9 种格式全覆盖 |
| 文本切片 | 自研 TextSplitter | 递归字符切分，中文标点感知 |
| Embedding | sentence-transformers (BGE-small-zh-v1.5) | 中文优化，本地运行，可切换 OpenAI |
| 向量数据库 | ChromaDB | 轻量开箱即用，每工作区独立 collection |
| 关系数据库 | SQLite / PostgreSQL | SQLAlchemy ORM，可无缝切换 |
| LLM 接入 | LiteLLM | 统一代理调用 OpenAI/DeepSeek/通义千问/GLM/Ollama |
| 日志 | Loguru | 结构化日志，全链路追踪 |

### 前端

### 飞书机器人

## 核心数据流

### 文档处理流程

\`\`\`
用户上传文件
    ↓
文件保存 (UPLOAD_DIR)
    ↓
Document 记录创建 (status=pending)
    ↓
文档解析 (Parser) → 提取文本和元数据
    ↓
文本切片 (TextSplitter) → 生成多个 chunk
    ↓
向量化 (EmbeddingService) → 生成 embedding 向量
    ↓
存储到 ChromaDB (VectorStore)
    ↓
更新 Document 状态 (status=ready)
\`\`\`

### RAG 查询流程

\`\`\`
用户提问
    ↓
问题向量化 (EmbeddingService.embed_query)
    ↓
向量检索 (VectorStore.search) → 获取 top-K 相关文档
    ↓
构建上下文 (RAGEngine._build_context)
    ↓
构建 Prompt (系统提示 + 对话历史 + 上下文 + 用户问题)
    ↓
LLM 生成 (LLMManager.generate_stream)
    ↓
SSE 流式返回 → 前端实时显示
\`\`\`

## 数据模型

### Workspace（工作区）

\`\`\`python
class Workspace(Base):
    __tablename__ = "workspaces"
    
    id = Column(String(36), primary_key=True)  # UUID
    name = Column(String(255), nullable=False)
    description = Column(Text, default="")
    slug = Column(String(255), unique=True, index=True)
    created_at = Column(DateTime(timezone=True))
    updated_at = Column(DateTime(timezone=True))
    
    # 关系
    documents = relationship("Document", cascade="all, delete-orphan", lazy="selectin")
\`\`\`

### Document（文档）

\`\`\`python
class Document(Base):
    __tablename__ = "documents"
    
    id = Column(String(36), primary_key=True)  # UUID
    workspace_id = Column(String(36), ForeignKey("workspaces.id", ondelete="CASCADE"))
    filename = Column(String(512))
    file_path = Column(String(1024))
    file_type = Column(String(50))  # 文件扩展名
    file_size = Column(Integer, default=0)
    chunk_count = Column(Integer, default=0)
    status = Column(String(20), index=True)  # pending/processing/ready/failed
    error_message = Column(Text, nullable=True)
    created_at = Column(DateTime(timezone=True))
    updated_at = Column(DateTime(timezone=True))
\`\`\`

class Conversation(Base):

## 核心模块详解

### RAG 引擎 (rag_engine.py)

**职责：** 协调向量化、检索、LLM 生成三大环节

**核心方法：**

- \`query(question, workspace_id, history, top_k)\` - 普通查询
- \`query_stream(...)\` - 流式查询（SSE）

**工作流程：**

1. 向量化问题 → \`embedding_service.embed_query()\`
2. 检索相关文档 → \`vector_store.search()\`
3. 构建上下文 → \`_build_context()\`
4. 构建 Prompt → \`_build_prompt()\`
5. LLM 生成 → \`llm_manager.generate()\`

**置信度计算：**

\`\`\`python
avg_distance = sum(distances) / len(distances)
confidence = math.exp(-avg_distance)  # 指数衰减归一化到 [0, 1]
\`\`\`

### LLM 管理器 (llm_manager.py)

**职责：** 通过 LiteLLM 统一调用多家 LLM 提供商

**支持的提供商：**

| Provider | 模型示例 | API Base |
|----------|---------|----------|
| openai | gpt-4o, gpt-4o-mini | 默认 |
| deepseek | deepseek-chat, deepseek-reasoner | https://api.deepseek.com/v1 |
| qwen | qwen-turbo, qwen-plus, qwen-max | https://dashscope.aliyuncs.com/compatible-mode/v1 |
| glm | glm-4-flash, glm-4-plus | https://open.bigmodel.cn/api/paas/v4 |
| ollama | 自定义模型 | 从 OLLAMA_BASE_URL 读取 |

**核心方法：**

- \`generate(messages, provider, model, temperature, max_tokens)\` - 异步生成
- \`generate_stream(...)\` - 流式生成
- \`test_connection(provider, model)\` - 测试连通性
- \`get_available_providers()\` - 获取已配置的提供商列表

### Embedding 服务 (embedding.py)

**职责：** 文本向量化

**支持的提供商：**

- **local**: sentence-transformers 本地模型（默认 BAAI/bge-small-zh-v1.5，512 维）
- **openai**: OpenAI API（text-embedding-3-small，1536 维）

**核心方法：**

- \`embed_texts(texts)\` - 批量向量化
- \`embed_query(query)\` - 单条查询向量化
- \`get_dimension()\` - 获取向量维度

**本地模型特点：**

- 延迟加载（首次调用时才加载）
- 使用 \`run_in_executor\` 在线程池中运行，避免阻塞事件循环
- 启用 \`normalize_embeddings=True\` 归一化

### 向量存储 (vector_store.py)

**职责：** 封装 ChromaDB 操作

**Collection 命名规则：**

\`\`\`python
f"ws_{workspace_id}".replace("-", "_")
\`\`\`

**核心方法：**

- \`get_or_create_collection(workspace_id)\` - 获取/创建 collection
- \`add_documents(workspace_id, doc_ids, texts, metadatas, embeddings)\` - 添加文档
- \`search(workspace_id, query_embedding, top_k)\` - 向量搜索
- \`delete_documents(workspace_id, doc_ids)\` - 删除文档
- \`delete_collection(workspace_id)\` - 删除整个 collection
- \`get_collection_stats(workspace_id)\` - 获取统计信息

**注意事项：**

- metadata 中的 \`None\` 值必须过滤（ChromaDB 不允许）
- 空 metadata 替换为 \`{"empty": True}\`

### 文本切片器 (text_splitter.py)

**职责：** 中文感知的递归字符切片

**默认分隔符优先级：**

\`\`\`python
["\\n\\n", "\\n", "。", ".", "！", "!", "？", "?", "；", ";", " ", ""]
\`\`\`

**核心算法：**

1. 按当前优先级分隔符切分
2. 合并过短的片段（不超过 chunk_size）
3. 超长片段递归使用下一优先级分隔符
4. 最终兜底：硬字符截断 \`_force_split()\`

**重叠处理：**

\`\`\`python
# 将前一个 chunk 的最后 chunk_overlap 个字符拼到当前 chunk 开头
overlap_text = prev_chunk[-self.chunk_overlap:]
overlapped = overlap_text + current_chunk
\`\`\`

## 文档处理流水线

### Pipeline (pipeline.py)

**六步流水线：**

1. 更新状态 → \`status="processing"\`
2. 解析文档 → \`parser.parse(file_path)\` → \`[{content, metadata}]\`
3. 文本切片 → \`text_splitter.split_documents(raw_chunks)\`
4. 向量化 → \`embedding_service.embed_texts(texts)\`
5. 存储到 ChromaDB → \`vector_store.add_documents(...)\`
6. 更新状态 → \`status="ready"\`, \`chunk_count=N\`

### 解析器

**BaseParser 抽象基类：**

\`\`\`python
class BaseParser(ABC):
    @abstractmethod
    def parse(self, file_path: str) -> list[dict]:
        # 返回 [{content: str, metadata: {page_num, heading, source_file}}]
        pass
\`\`\`

**支持的解析器：**

| 格式 | 解析器 | 技术 |
|------|--------|------|
| PDF | PDFParser | PyMuPDF 逐页提取 |
| DOCX | DocxParser | python-docx 段落和表格 |
| PPTX | PptxParser | python-pptx 逐 slide |
| Markdown | MarkdownParser | 按标题分段，保留代码块 |
| TXT | _TxtParser | chardet 编码检测 |
| XLSX | _XlsxParser | openpyxl 每行转键值对 |
| CSV | _CsvParser | csv.reader 表头+数据行 |
| HTML | _HtmlParser | BeautifulSoup 提取正文 |

# 飞书机器人

## 架构设计

**连接方式：** WebSocket 长连接（无需公网 IP）

**核心组件：**

- \`main.py\` - WebSocket 客户端启动
- \`handler.py\` - 消息处理与分发
- \`commands.py\` - 指令解析与路由
- \`cards.py\` - 飞书消息卡片构建
- \`auth.py\` - Token 管理（自动刷新）

## 启动流程

\`\`\`python
# 1. 加载 BotConfig
# 2. 创建 asyncio event loop
# 3. 初始化：Redis → TokenManager → CommandRouter → MessageHandler
# 4. 构建 event dispatcher，注册 im.message.receive_v1 回调
# 5. lark.ws.Client(app_id, app_secret, event_handler=dispatcher).start()
# 6. SDK 回调是同步的，用 asyncio.run_coroutine_threadsafe 桥接到 async handler
# 7. SIGINT/SIGTERM 优雅关闭所有组件
\`\`\`

## 指令系统

| 指令 | 格式 | 功能 |
|------|------|------|
| 直接提问 | \`Python 装饰器怎么用？\` | 基于知识库 RAG 回答 |
| 搜索 | \`/search 关键词\` | 仅检索，返回相关文档片段 |
| 知识库状态 | \`/status\` | 查看文档数量、最近更新等 |
| 切换工作区 | \`/ws 工作区名称\` | 切换当前查询的知识库工作区 |
| 帮助 | \`/help\` | 显示所有可用指令 |

## Token 管理

**TokenManager 类：**

- 管理 \`tenant_access_token\` 生命周期
- API: \`POST https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal\`
- 内存缓存 token，在到期前 5 分钟自动刷新
- \`async get_token() → str\`

## 消息卡片

**卡片类型：**

| 函数 | 标题颜色 | 内容 |
|------|---------|------|
| \`build_answer_card\` | 蓝色 | 回答 + 来源引用 + 置信度 + 反馈按钮 |
| \`build_help_card\` | 绿色 | 指令列表说明 |

# 关键设计决策

## 1. ChromaDB Collection 命名

统一为 \`ws_{workspace_id}\`（短横线替换为下划线），所有模块必须保持一致。

## 2. Metadata 规范

必须包含 \`source_file\` 键（RAG 引擎用它引用来源文件名）。

## 3. ChromaDB Space 配置

创建 collection 时设置 \`metadata={"hnsw:space": "cosine"}\`。

## 4. Redis 数据库隔离

- 飞书 Bot 使用 Redis DB 1
- 后端使用 Redis DB 0
- 避免键冲突

## 5. 文档处理方式

当前采用内联同步执行（在 documents.py 的 \`_process_document\` 中），Celery Worker 定义了但未实际使用，后续可替换。

## 6. 错误处理

所有外部服务调用（ChromaDB/LLM/飞书 API）必须有 try/except 和 loguru 日志。

## 7. LLM 调用统一

通过 litellm 统一调用，不直接调用各家 SDK。

## 8. Embedding 模型延迟加载

本地模型延迟加载，避免启动时阻塞。

## 9. 中文优先

所有用户可见的文本（Prompt/卡片/UI）使用中文。

## 10. Python 版本

要求 3.11+，3.14 可能存在兼容性问题。
