# 开发环境覆盖配置
# 使用方式：docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # ============ Backend API (开发模式) ============
  backend:
    image: knowbase-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - LOG_LEVEL=DEBUG
    ports: !override
      - "8000:8000"

  # ============ Celery Worker (开发模式) ============
  worker:
    image: knowbase-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: celery -A app.collector.tasks worker --loglevel=debug --concurrency=2 --pool=solo
    environment:
      - LOG_LEVEL=DEBUG

  # ============ Feishu Bot (开发模式) ============
  feishu-bot:
    volumes:
      - ./feishu-bot:/app
      - /app/__pycache__
    command: python main.py
    environment:
      - LOG_LEVEL=DEBUG

  # ============ Frontend (开发模式) ============
  frontend:
    image: knowbase-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    ports: !override
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
