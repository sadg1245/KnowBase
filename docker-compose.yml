services:
  # ============ Backend API ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowbase-backend
    ports:
      - "9000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - HF_HOME=/opt/huggingface
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    networks:
      - knowbase-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============ Celery Worker ============
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowbase-worker
    command: celery -A app.collector.tasks worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - HF_HOME=/opt/huggingface
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
    networks:
      - knowbase-net
    restart: unless-stopped

  # ============ Feishu Bot ============
  feishu-bot:
    build:
      context: ./feishu-bot
      dockerfile: Dockerfile
    container_name: knowbase-feishu-bot
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - knowbase-net
    restart: unless-stopped

  # ============ Frontend ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowbase-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - knowbase-net
    restart: unless-stopped

  # ============ ChromaDB (Vector Store) ============
  chromadb:
    image: chromadb/chroma:latest
    container_name: knowbase-chromadb
    ports:
      - "127.0.0.1:9001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    networks:
      - knowbase-net
    restart: unless-stopped

  # ============ Redis (Cache + Queue) ============
  redis:
    image: redis:7-alpine
    container_name: knowbase-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - knowbase-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  knowbase-net:
    driver: bridge

volumes:
  backend_data:
  backend_uploads:
  chroma_data:
  redis_data:
