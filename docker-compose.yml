# 后端与 worker 共用同一套容器内路径约定：
# 数据库、上传原文与受控媒体（头像/封面）都落在 backend_data 卷里，便于整卷备份与迁移。
# 这些值默认与卷挂载点一致；如需改用 PostgreSQL 等外部数据库，在 .env 里设置 DATABASE_URL 即可覆盖。
x-backend-environment: &backend-environment
  # 应用主目录：密钥、备份与本机偏好都放在这里，必须落在持久化卷上
  DATA_ROOT: ${DATA_ROOT:-/app/data}
  DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:////app/data/sqlite/knowbase.db}
  UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
  MEDIA_DIR: ${MEDIA_DIR:-/app/data/media}

services:
  # ============ Backend API ============
  backend:
    image: knowbase-backend:production
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: knowbase-backend
    ports:
      - "9000:8000"
    env_file:
      - .env
    environment:
      <<: *backend-environment
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      HF_HOME: /opt/huggingface
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - model_cache:/opt/huggingface
    networks:
      - knowbase-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============ Celery Worker ============
  worker:
    image: knowbase-backend:production
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: knowbase-worker
    command: celery -A app.collector.tasks worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      <<: *backend-environment
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      HF_HOME: /opt/huggingface
    depends_on:
      # worker 写入文档、知识点与学习活动，必须等 backend 的迁移跑完再启动。
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      - model_cache:/opt/huggingface
    networks:
      - knowbase-net
    restart: unless-stopped

  # ============ Feishu Bot ============
  feishu-bot:
    build:
      context: ./feishu-bot
      dockerfile: Dockerfile
    container_name: knowbase-feishu-bot
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - REDIS_URL=redis://redis:6379/1
      # 服务令牌是后端与机器人之间的共享密钥：这里直接跟随 SERVICE_TOKEN，
      # 避免两个值不一致导致机器人拿到 401。
      - BACKEND_ACCESS_TOKEN=${SERVICE_TOKEN:-}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - knowbase-net
    restart: unless-stopped

  # ============ Frontend ============
  frontend:
    image: knowbase-frontend:production
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: knowbase-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - knowbase-net
    restart: unless-stopped

  # ============ ChromaDB (Vector Store) ============
  chromadb:
    image: chromadb/chroma:latest
    container_name: knowbase-chromadb
    ports:
      - "127.0.0.1:9001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    networks:
      - knowbase-net
    restart: unless-stopped

  # ============ Redis (Cache + Queue) ============
  redis:
    image: redis:7-alpine
    container_name: knowbase-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - knowbase-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  knowbase-net:
    driver: bridge

volumes:
  backend_data:
  backend_uploads:
  model_cache:
  chroma_data:
  redis_data:
