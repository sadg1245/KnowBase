# KnowBase 裸机站点配置：托管前端静态文件 + 反代 /api 到后端
#
# 安装：deploy/baremetal/deploy.sh 会自动拷贝到 /etc/nginx/conf.d/knowbase.conf
# 手动安装：
#   sudo cp deploy/baremetal/nginx-knowbase.conf /etc/nginx/conf.d/knowbase.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 注意：这里刻意不写 default_server。RHEL 系自带的 /etc/nginx/nginx.conf
# 已经有一个 listen 80 default_server 的默认站点，两个 default_server 会让 nginx -t 直接报错。
# deploy.sh 会把主配置换成只包含本站点的精简版本；若你选择保留原配置（KEEP_NGINX_CONF=1），
# 需要自己把原默认站点的 server 块删掉或改成别的端口。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /opt/knowbase/frontend/dist;
    index index.html;

    # 与前端上传限制保持一致
    client_max_body_size 50m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/knowbase.access.log;
    error_log  /var/log/nginx/knowbase.error.log;

    # 前端是单页应用：找不到的路径一律回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口文件与 service worker 不缓存，保证发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # 构建产物文件名带内容哈希，可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API：proxy_pass 后面不要加斜杠，/api 前缀必须原样保留
    location /api {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 检索接口是 SSE 流式返回，必须关缓冲，否则前端要等整段结束才显示；
        # 出题、评分要走模型生成，读超时放宽到 300s
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
