# 宿主机 Nginx 站点配置：80 → 前端容器（127.0.0.1:3000）
#
# 安装：
#   sudo cp deploy/nginx/knowbase.conf /etc/nginx/conf.d/knowbase.conf
#   sudo sed -i 's/__DOMAIN__/your.domain.com/g' /etc/nginx/conf.d/knowbase.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 只记 IP、没有域名时，把 server_name 改成下划线：server_name _;
# 配 HTTPS：sudo dnf install -y certbot python3-certbot-nginx && sudo certbot --nginx -d your.domain.com

upstream knowbase_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 上传大小限制，与 frontend/nginx.conf 的 client_max_body_size 保持一致
    client_max_body_size 50m;

    access_log /var/log/nginx/knowbase.access.log;
    error_log  /var/log/nginx/knowbase.error.log;

    location / {
        proxy_pass http://knowbase_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 出题、评分、长回答要走模型生成，读超时放宽到 300s；
        # 检索接口是 SSE 流式返回，必须关掉缓冲，否则前端要等整段结束才显示。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
